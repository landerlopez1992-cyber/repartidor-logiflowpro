name: '📱 Build Repartidor · Android (On-Demand)'

# Repo: repartidor-logiflowpro (App Repartidor · Repartidor Logiflow Pro)
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'UUID del job en logiflow_build_jobs (Supabase)'
        required: true
        type: string

env:
  SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
  SUPABASE_SVC_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
  STORAGE_BUCKET:    logiflow-descargas
  GRADLE_OPTS:       -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
  JAVA_TOOL_OPTIONS: -Xmx4g

jobs:
  build-android:
    name: 'Compilar APK y subir a Supabase Storage'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 'Supabase: estado → construyendo'
        run: |
          curl -sfX PATCH \
            "$SUPABASE_URL/rest/v1/logiflow_build_jobs?id=eq.${{ inputs.job_id }}" \
            -H "apikey: $SUPABASE_SVC_KEY" \
            -H "Authorization: Bearer $SUPABASE_SVC_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"estado\":\"construyendo\",\"github_run_id\":\"${{ github.run_id }}\"}"

      - name: Checkout código (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Verificar entorno
        run: |
          flutter --version
          dart --version
          java -version

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk --release
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: 'Supabase: estado → subiendo'
        run: |
          curl -sfX PATCH \
            "$SUPABASE_URL/rest/v1/logiflow_build_jobs?id=eq.${{ inputs.job_id }}" \
            -H "apikey: $SUPABASE_SVC_KEY" \
            -H "Authorization: Bearer $SUPABASE_SVC_KEY" \
            -H "Content-Type: application/json" \
            -d '{"estado":"subiendo"}'

      - name: Subir APK a Supabase Storage
        run: |
          APK=$(find build/app/outputs/flutter-apk -name 'app-release.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No se encontró app-release.apk"
            exit 1
          fi
          echo "APK: $APK ($(du -sh "$APK" | cut -f1))"

          curl -sfX POST \
            "$SUPABASE_URL/storage/v1/object/$STORAGE_BUCKET/android/app_repartidor.apk" \
            -H "apikey: $SUPABASE_SVC_KEY" \
            -H "Authorization: Bearer $SUPABASE_SVC_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@$APK"

          PUBLIC_URL="$SUPABASE_URL/storage/v1/object/public/$STORAGE_BUCKET/android/app_repartidor.apk"
          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"
          echo "✅ Subido a: $PUBLIC_URL"

      - name: 'Supabase: estado → listo + actualizar URL'
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          curl -sfX PATCH \
            "$SUPABASE_URL/rest/v1/logiflow_build_jobs?id=eq.${{ inputs.job_id }}" \
            -H "apikey: $SUPABASE_SVC_KEY" \
            -H "Authorization: Bearer $SUPABASE_SVC_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"estado\":\"listo\",\"artifact_url\":\"$PUBLIC_URL\",\"completado_at\":\"$NOW\"}"

          curl -sfX PATCH \
            "$SUPABASE_URL/rest/v1/logiflow_descargas_app?id=eq.1" \
            -H "apikey: $SUPABASE_SVC_KEY" \
            -H "Authorization: Bearer $SUPABASE_SVC_KEY" \
            -H "Prefer: return=minimal" \
            -H "Content-Type: application/json" \
            -d "{\"google_play_url\":\"$PUBLIC_URL\",\"mostrar_google_play\":true}"

          echo "✅ Build completado. URL: $PUBLIC_URL"

      - name: 'Supabase: estado → error (si falló)'
        if: failure()
        run: |
          ERR_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          HINT=""
          if [ -f build.log ]; then
            HINT=$(grep -E "Error:|FAILURE|Exception|IconData|keystore|OutOfMemory" build.log | tail -5 | tr '\n' ' ' | head -c 400)
          fi
          MSG="Build fallido. Ver log: $ERR_URL"
          if [ -n "$HINT" ]; then
            MSG="$MSG | $HINT"
          fi
          curl -sfX PATCH \
            "$SUPABASE_URL/rest/v1/logiflow_build_jobs?id=eq.${{ inputs.job_id }}" \
            -H "apikey: $SUPABASE_SVC_KEY" \
            -H "Authorization: Bearer $SUPABASE_SVC_KEY" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,sys; print(json.dumps({'estado':'error','error_mensaje':sys.argv[1]}))" "$MSG")"

      - name: Subir build.log si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-android-${{ github.run_id }}
          path: build.log
          if-no-files-found: ignore
