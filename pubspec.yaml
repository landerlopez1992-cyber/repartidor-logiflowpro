name: repartidor_logiflow_pro
description: "App exclusiva para repartidores de VolonexPro+"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.31+42

environment:
  sdk: ^3.9.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below
# to the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  
  # Supabase dependencies
  supabase_flutter: ^2.10.0
  
  # Image picker for profile photos
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  
  # URL launcher for phone calls
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  printing: ^5.14.2
  pdf: ^3.11.3
  http: ^1.5.0
  geocoding: ^2.1.1
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  webview_flutter: ^4.7.0
  # Guía por voz al chofer (turnos / destino), estilo Google Maps.
  flutter_tts: ^4.2.3
  
  # QR Code Scanner
  mobile_scanner: ^7.1.3
  
  # Notificaciones push locales
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  vibration: ^3.1.4
  audioplayers: ^6.1.0
  # 6.x: alinea record_linux con record_platform_interface (evita error de build macOS).
  record: ^6.1.2

  # Push FCM (app cerrada)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  
  # Permisos (para ubicación en segundo plano)
  permission_handler: ^11.3.1
  
  # Verificación de conectividad
  connectivity_plus: ^6.1.0
  
  # Captura de firma digital
  signature: ^5.4.0
  
  # Almacenamiento local para modo offline
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  
  # Información del paquete (para versiones y actualizaciones)
  package_info_plus: ^8.0.0
  # API oficial de Google Play (actualización disponible; pistas internas)
  in_app_update: ^4.2.3
  
  # Shorebird para actualizaciones OTA
  shorebird_code_push: ^2.0.5
  
  # Calendario para salidas programadas
  table_calendar: ^3.1.2
  
  # Iconos de Font Awesome (para WhatsApp y otros)
  font_awesome_flutter: ^11.0.0
  
  # Confeti para celebraciones
  confetti: ^0.7.0
  mbtiles: ^0.5.0
  crypto: ^3.0.7
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information on deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  
  # Generate app icons
  flutter_launcher_icons: ^0.13.1

# http 1.6.0 rompe compilación web (typo dortoDart); Repartidor es solo móvil.
dependency_overrides:
  http: 1.5.0


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # CocoaPods en macOS (ruta con espacios + plugins sin SPM).
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the Material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/logo_julio.png
    - assets/logo_julio_icon.png
    - assets/logiflow_pro_logo.png
    - assets/www.logiflowpro.com.png
    - assets/sounds/chat_mensaje.mp3
    - assets/sounds/taxi_buscando_on.mp3
    - assets/sounds/taxi_buscando_off.mp3
    - assets/images/foto_vehiculo_ejemplo.png
    - assets/images/taxi-auto-clasico-3d-v3.png
    - assets/images/taxi-auto-van-3d-v3.png
    - assets/images/taxi-auto-estandar-3d-v3.png
    - assets/images/taxi-auto-comfort-3d-v3.png
    - assets/images/taxi-icon-3d-v3.png
    - assets/images/payment_zelle_3d.png
    - assets/images/connectivity_offline_3d.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. For example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic

